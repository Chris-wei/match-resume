<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:400px;height:400px;overflow:hidden}
body{font-family:'PingFang SC',-apple-system,sans-serif;background:linear-gradient(150deg,#4a68ff 0%,#2a44d8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08);right:-110px;top:-120px}
.ring{width:210px;height:210px;border-radius:50%;background:conic-gradient(#ffd66b 72%,rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center;position:relative}
.ring-in{width:172px;height:172px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(10,20,80,.25)}
.num{font-size:74px;font-weight:800;color:#3b5bfd;line-height:1}
.lab{font-size:20px;color:#6b7280;margin-top:8px}
.q{color:#fff;font-size:30px;font-weight:700;margin-top:28px;letter-spacing:1px;position:relative}
</style></head><body><div class="glow"></div>
<div class="ring"><div class="ring-in"><div class="num">?</div><div class="lab">你的匹配分</div></div></div>
<div class="q">简历和岗位匹配几分？</div>
</body></html>
